plugins {
    id 'com.android.library'
}

android {
    namespace 'su.copium.libraries'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    // forcing NDK version to the one present in github CI runner to skip redownloading NDK on each run
    ndkVersion "30.0.16248370" 

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    def extraArgs = project.findProperty("EXTRA_CMAKE_ARGS") ?: ""

                    arguments "-DCMAKE_BUILD_TYPE=Release",
                    *extraArgs.split("\\s+").toList()
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
            // force version for CI runner
            version "3.26.0"
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
}