name: Release all flavours

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
        - name: Set envs
          run: |
            echo "TIME=$(date --rfc-3339=date)" >> $GITHUB_ENV
            echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
        - name: Download artifacts
          uses: dawidd6/action-download-artifact@v6
          with:
              workflow: build.yml
              branch: master
              workflow_conclusion: success
              path: out/
        - name: Upload Releases
          uses: softprops/action-gh-release@v3
          with:
            name: ZSTD AAR Release ${{ env.TIME }}
            tag_name: zstd-aar-release-${{ env.SHORT_SHA }}
            body: |
              To download the artifact click on **▶Assets**, then choose the file you wish to download.
              
              >Vanilla ZSTD build: `zstd-vanilla`<br>
              >DH renamed ZSTD build: `zstd-dh`
              
              Commit hash: ${{ github.sha }}
            files: |
              out/zstd-release/*
              out/zstd-dh-release/*

