name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install CMake
        uses: lukka/get-cmake@latest
      - name: Setup CCache
        uses: jianmingyong/ccache-action@v1
        with:
          ccache-key-prefix: ccache_cache_
          max-size: 150M
      - name: Apply ZSTD patches
        run: |
          git apply --verbose ./patches/zstd/CMakeLists.patch
          pushd ./app/src/main/zstd; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/zstd-dh/break_droidcringe.patch; popd
            
      - name: Prepare ZSTD for DH
        run: bash ./patches/zstd-dh/prepare.sh
      - name: Apply rnnoise4j-svc CMake patches
        run: git apply --verbose ./patches/rnnoise4j-svc/CMakeLists.patch
      - name: Apply lame4j-svc CMake patches
        run: git apply --verbose ./patches/lame4j-svc/CMakeLists.patch
      - name: Apply speex4j-svc CMake patches
        run: git apply --verbose ./patches/speex4j-svc/CMakeLists.patch
      - name: Build
        run: gradle :app:assembleRelease -PEXTRA_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libraries-release
          path: app/build/outputs/aar/app-release.aar
