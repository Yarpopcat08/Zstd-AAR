name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: zstd-release
            dh: false
          - artifact: zstd-dh-release
            dh: true
    name: Build ${{ matrix.artifact }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Apply ZSTD CMake patches
        run: git apply --verbose ./patches/zstd/CMakeLists.patch
      - name: Apply ZSTD breaker patch
        if: matrix.dh
        run: pushd ./app/src/main/zstd; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/zstd-dh/break_droidcringe.patch; popd
      - name: Rename ZSTD for DH
        if: matrix.dh
        run: bash ./patches/zstd-dh/renamer.sh
      - name: Apply ZSTD DH CMake patches
        if: matrix.dh
        run: git apply --verbose ./patches/zstd-dh/CMakeLists.patch
      - name: Apply rnnoise4j-svc CMake patches
        run: git apply --verbose ./patches/rnnoise4j-svc/CMakeLists.patch
      - name: Apply lame4j-svc CMake patches
        run: git apply --verbose ./patches/lame4j-svc/CMakeLists.patch
      - name: Apply speex4j-svc CMake patches
        run: git apply --verbose ./patches/speex4j-svc/CMakeLists.patch
      - name: Build
        run: ./gradlew :app:assembleRelease
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/build/outputs/aar/app-release.aar
